<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620"><stop stop-color="#050A12"/><stop offset="1" stop-color="#0A1E2A"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#63F5A6"/></marker><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#EAF8FB}.s{fill:#7899A6}.c{fill:#7CE7F7}.g{fill:#63F5A6}.loop{stroke:#2D6472;stroke-width:14;fill:none;stroke-linecap:round}.flow{stroke:#63F5A6;stroke-width:3;fill:none;stroke-dasharray:10 12}</style></defs><rect width="1200" height="620" rx="24" fill="url(#bg)"/><text x="42" y="42" class="m s" font-size="13">INFINITE CI/CD LOOP // SOFTWARE DELIVERY NEVER REALLY ENDS</text><text x="42" y="70" class="m c" font-size="11">CODE → VERIFY → PACKAGE → RELEASE → OPERATE → LEARN → CODE AGAIN</text>
<path id="infinity" d="M190 315 C270 160 450 160 600 315 C750 470 930 470 1010 315 C930 160 750 160 600 315 C450 470 270 470 190 315" class="loop"/>
<path d="M190 315 C270 160 450 160 600 315 C750 470 930 470 1010 315 C930 160 750 160 600 315 C450 470 270 470 190 315" class="flow"><animate attributeName="stroke-dashoffset" values="80;0" dur="1.8s" repeatCount="indefinite"/></path>
<circle r="9" class="g" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" rotate="auto"><mpath href="#infinity"/></animateMotion></circle><circle r="6" class="c" filter="url(#glow)"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite" rotate="auto"><mpath href="#infinity"/></animateMotion></circle>
<g class="m" text-anchor="middle"><g transform="translate(115 270)"><rect width="155" height="88" rx="13" fill="#0D202B" stroke="#347484"/><text x="77" y="27" class="c" font-size="13">01 // CODE</text><text x="77" y="49" class="h" font-size="11">React · Next.js</text><text x="77" y="67" class="s" font-size="10">FastAPI · Laravel · Node</text></g><g transform="translate(285 112)"><rect width="165" height="88" rx="13" fill="#0D202B" stroke="#347484"/><text x="82" y="27" class="c" font-size="13">02 // VERIFY</text><text x="82" y="49" class="h" font-size="11">tests · lint · contracts</text><text x="82" y="67" class="s" font-size="10">GitHub Actions</text></g><g transform="translate(520 225)"><rect width="165" height="88" rx="13" fill="#0D202B" stroke="#63F5A6"/><text x="82" y="27" class="g" font-size="13">03 // PACKAGE</text><text x="82" y="49" class="h" font-size="11">Docker · artifacts</text><text x="82" y="67" class="s" font-size="10">images · env config</text></g><g transform="translate(750 112)"><rect width="165" height="88" rx="13" fill="#0D202B" stroke="#347484"/><text x="82" y="27" class="c" font-size="13">04 // RELEASE</text><text x="82" y="49" class="h" font-size="11">CI/CD · registry</text><text x="82" y="67" class="s" font-size="10">Terraform · AWS</text></g><g transform="translate(925 270)"><rect width="155" height="88" rx="13" fill="#0D202B" stroke="#347484"/><text x="77" y="27" class="c" font-size="13">05 // OPERATE</text><text x="77" y="49" class="h" font-size="11">Linux · Nginx</text><text x="77" y="67" class="s" font-size="10">Redis · PM2 · SSL</text></g><g transform="translate(750 420)"><rect width="165" height="88" rx="13" fill="#0D202B" stroke="#347484"/><text x="82" y="27" class="c" font-size="13">06 // OBSERVE</text><text x="82" y="49" class="h" font-size="11">logs · health · metrics</text><text x="82" y="67" class="s" font-size="10">CloudWatch · alerts</text></g><g transform="translate(285 420)"><rect width="165" height="88" rx="13" fill="#0D202B" stroke="#347484"/><text x="82" y="27" class="c" font-size="13">07 // IMPROVE</text><text x="82" y="49" class="h" font-size="11">feedback · rollback</text><text x="82" y="67" class="s" font-size="10">architecture decisions</text></g></g>
<g transform="translate(42 548)" class="m"><text class="s" font-size="11">WHY THE LOOP?</text><text x="115" class="h" font-size="11">production telemetry feeds the next design decision — delivery is a feedback system, not a finish line.</text><text y="28" class="s" font-size="10">STACK:</text><text x="55" y="28" class="g" font-size="10">GitHub Actions · Docker · Linux · AWS · Terraform · Nginx · Redis · CloudWatch · React · Next.js · FastAPI · Laravel · Node.js</text></g></svg>